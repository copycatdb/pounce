[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "adbc_driver_mssql"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["pyarrow>=12.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "adbc_driver_mssql._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
