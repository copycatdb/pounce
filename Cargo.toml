[package]
name = "adbc_driver_mssql"
version = "0.1.0"
edition = "2021"

[lib]
name = "adbc_driver_mssql"
crate-type = ["cdylib"]

[features]
default = ["rustls", "chrono", "rust_decimal"]
rustls = []
chrono = []
rust_decimal = []

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-rustls = "0.26"
rustls = "0.23"
once_cell = "1"
arrow = { version = "55", features = ["ffi"] }
chrono = { version = "0.4", default-features = false }
uuid = "1"
futures-util = { version = "0.3", default-features = false, features = ["io", "sink"] }
rust_decimal = "1"

# Dependencies from embedded TDS implementation
enumflags2 = "0.7"
byteorder = "1.0"
encoding_rs = "0.8"
thiserror = "1.0"
bytes = "1.0"
pretty-hex = "0.3"
pin-project-lite = "0.2"
asynchronous-codec = "0.6"
async-trait = "0.1"
connection-string = "0.2"
num-traits = "0.2"
tracing = { version = "0.1", features = ["log"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
